macos-arm64:
  image: mac-arm64
  cpus: 4
  memory: 12G
  steps:
    - name: Copy Files
      copy:
        from: ./
        to: vm:~/
        exclude:
          - .git
          - .github
          - docs
          - target

    - name: Install Rust
      run: |
        curl --proto '=https' --tlsv1.2 -sSf --retry 3 https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
        . "$HOME/.cargo/env"
        # rustup keeps partial downloads, so retry is a resume!
        for i in 1 2 3 4 5; do
          rustup toolchain install stable --profile minimal --target x86_64-apple-darwin,aarch64-apple-darwin && break
          if [ "$i" -eq 5 ]; then echo "rustup toolchain install failed after $i attempts"; exit 1; fi
          sleep 10
        done
        rustup default stable

    - name: Install Node and NPM
      # https://nodejs.org/dist/v24.16.0/SHASUMS256.txt
      run: |
        set -euo pipefail
        NODE_VER=v24.16.0
        NODE_TARBALL=node-${NODE_VER}-darwin-arm64.tar.xz
        NODE_SHA256=e28ad5531b2aafe0ea555a51b2412c42fdc0f91a6a53fbd03ac93e3847e91389
        curl --proto '=https' --tlsv1.2 -fsSLO "https://nodejs.org/dist/${NODE_VER}/${NODE_TARBALL}"
        echo "${NODE_SHA256}  ${NODE_TARBALL}" | shasum -a 256 -c -
        sudo tar -xJf "${NODE_TARBALL}" -C /usr/local --strip-components=1
        rm -f "${NODE_TARBALL}"

    - name: Verify npm Supports Release-Age Cooldown
      # npm must be >= 11.10.0 because that has `min-release-age`. Anything lower will just silently ignore, not acceptable.
      run: |
        set -euo pipefail
        export PATH="/usr/local/bin:$PATH"
        node --version
        npm --version
        npm --version | awk -F. '($1<11)||($1==11 && $2<10){ print "npm "$0" is too old for min-release-age (need >= 11.10.0)"; exit 1 }'

    # - name: Install NPM Dependencies
    #   run: |
    #     cd web
    #     npm install

    - name: Build aarch64
      run: cargo build --release --target aarch64-apple-darwin

    - name: Build x86_64
      run: cargo build --release --target x86_64-apple-darwin

    - name: Create fat binary
      run: |
        lipo -create \
          target/aarch64-apple-darwin/release/virtci \
          target/x86_64-apple-darwin/release/virtci \
          -output virtci
        chmod +x virtci

    - name: Package
      run: tar czf virtci-macos-multiarch.tar.gz virtci

    - name: Copy Files
      copy:
        from: vm:~/virtci-macos-multiarch.tar.gz
        to: ./
