ubuntu-arm64:
  image: ubuntu-arm64
  cpus: 4
  memory: 12G
  steps:
    - name: Copy Files
      copy:
        from: ./
        to: vm:~/
        exclude:
          - .git
          - .github
          - docs
          - target

    - name: Install Rust
      run: |
        curl --proto '=https' --tlsv1.2 -sSf --retry 3 https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
        . "$HOME/.cargo/env"
        # rustup keeps partial downloads, so retry is a resume!
        for i in 1 2 3 4 5; do
          rustup toolchain install stable --profile minimal && break
          if [ "$i" -eq 5 ]; then echo "rustup toolchain install failed after $i attempts"; exit 1; fi
          sleep 10
        done
        rustup default stable

    - name: Install Node and NPM
      # https://nodejs.org/dist/v24.16.0/SHASUMS256.txt
      run: |
        set -euo pipefail
        NODE_VER=v24.16.0
        NODE_TARBALL=node-${NODE_VER}-linux-arm64.tar.xz
        NODE_SHA256=524659219d6a207a7400f2bde15d19ba060ffbe0d32a8643319ad67e3bb64c78
        curl --proto '=https' --tlsv1.2 -fsSLO "https://nodejs.org/dist/${NODE_VER}/${NODE_TARBALL}"
        echo "${NODE_SHA256}  ${NODE_TARBALL}" | shasum -a 256 -c -
        sudo tar -xJf "${NODE_TARBALL}" -C /usr/local --strip-components=1
        rm -f "${NODE_TARBALL}"

    - name: Verify npm Supports Release-Age Cooldown
      # npm must be >= 11.10.0 because that has `min-release-age`. Anything lower will just silently ignore, not acceptable.
      run: |
        set -euo pipefail
        node --version
        npm --version
        npm --version | awk -F. '($1<11)||($1==11 && $2<10){ print "npm "$0" is too old for min-release-age (need >= 11.10.0)"; exit 1 }'

    # - name: Install NPM Dependencies
    #   run: |
    #     cd web
    #     npm install

    - name: Build
      run: . "$HOME/.cargo/env" && cargo build --release

    - name: Package
      run: tar czf virtci-linux-arm64.tar.gz -C target/release virtci

    - name: Build .deb
      run: |
        VERSION=$(./target/release/virtci version | sed 's/VirtCI version: //')
        PKGDIR="virtci_${VERSION}_arm64"
        mkdir -p "${PKGDIR}/DEBIAN" "${PKGDIR}/usr/bin"
        cp target/release/virtci "${PKGDIR}/usr/bin/virtci"
        chmod +x "${PKGDIR}/usr/bin/virtci"
        printf 'Package: virtci\nVersion: %s\nArchitecture: arm64\nMaintainer: virtci contributors\nDepends: qemu-kvm, qemu-utils, swtpm\nDescription: Virtual machine CI runner\n' \
          "${VERSION}" > "${PKGDIR}/DEBIAN/control"
        dpkg-deb --build "${PKGDIR}" virtci-linux-arm64.deb

    - name: Build .rpm
      run: |
        sudo apt install -y -qq rpm
        VERSION=$(./target/release/virtci version | sed 's/VirtCI version: //')
        TOPDIR="$(pwd)/rpmbuild"
        mkdir -p "${TOPDIR}"/{BUILD,RPMS,SOURCES,SPECS,SRPMS,BUILDROOT}
        cat > "${TOPDIR}/SPECS/virtci.spec" <<SPEC
        %global debug_package %{nil}
        %global __strip /bin/true
        %define _build_id_links none
        Name:        virtci
        Version:     ${VERSION}
        Release:     1
        Summary:     Virtual machine CI runner
        License:     GPL-2.0-only
        URL:         https://github.com/virtci/virtci
        BuildArch:   aarch64
        Requires:    qemu-kvm
        Requires:    qemu-img
        Requires:    swtpm
        AutoReqProv: no

        %description
        Virtual machine CI runner.

        %install
        mkdir -p %{buildroot}/usr/bin
        install -m 755 ${PWD}/target/release/virtci %{buildroot}/usr/bin/virtci

        %files
        /usr/bin/virtci
        SPEC
        rpmbuild --define "_topdir ${TOPDIR}" -bb "${TOPDIR}/SPECS/virtci.spec"
        cp "${TOPDIR}"/RPMS/aarch64/virtci-*.rpm virtci-linux-arm64.rpm

    - name: Copy Files
      copy:
        from: vm:~/virtci-linux-arm64.tar.gz
        to: ./

    - name: Copy .deb
      copy:
        from: vm:~/virtci-linux-arm64.deb
        to: ./

    - name: Copy .rpm
      copy:
        from: vm:~/virtci-linux-arm64.rpm
        to: ./
