windows-check-x64:
  image: win-11-x64
  cpus: 2
  memory: 8G
  steps:
    - name: Copy Files
      copy:
        from: ./
        to: vm:~/virtci
        exclude:
          - .git
          - .github
          - docs
          - target
          - .ci/upstream/*.img
          - .ci/temp

    - name: Install Rust
      run: |
        $ErrorActionPreference = "Stop"
        & curl.exe -fsSL --retry 3 -o rustup-init.exe https://win.rustup.rs/aarch64
        if ($LASTEXITCODE -ne 0) { throw "Failed to download rustup-init (curl exit $LASTEXITCODE)." }
        .\rustup-init.exe -y --profile minimal --default-toolchain none
        if ($LASTEXITCODE -ne 0) { throw "rustup-init failed (exit $LASTEXITCODE)." }
        $rustup = Join-Path $env:USERPROFILE ".cargo\bin\rustup.exe"
        # rustup keeps partial downloads, so retry is a resume!
        for ($i = 1; $i -le 5; $i++) {
          & $rustup toolchain install stable --profile minimal --component clippy,rustfmt
          if ($LASTEXITCODE -eq 0) { break }
          if ($i -eq 5) { throw "rustup toolchain install failed after $i attempts" }
          Start-Sleep -Seconds 10
        }
        & $rustup default stable
        if ($LASTEXITCODE -ne 0) { throw "rustup default stable failed (exit $LASTEXITCODE)." }

    - name: Install Node and NPM
      # https://nodejs.org/dist/v24.16.0/SHASUMS256.txt
      run: |
        $ErrorActionPreference = "Stop"
        $ProgressPreference = "SilentlyContinue"
        $NodeVer = "v24.16.0"
        $NodeZip = "node-$NodeVer-win-x64.zip"
        $NodeSha256 = "edaca9bd58ec8e92037dac4e877d52f6b8f430b81c18b57e264b4e2fb111cd56"
        $dest = Join-Path $env:TEMP $NodeZip
        & curl.exe --proto "=https" --tlsv1.2 -fsSL --retry 3 --retry-delay 2 -o $dest "https://nodejs.org/dist/$NodeVer/$NodeZip"
        if ($LASTEXITCODE -ne 0) { throw "Failed to download Node (curl exit $LASTEXITCODE)." }
        $actual = (Get-FileHash $dest -Algorithm SHA256).Hash
        if ($actual -ne $NodeSha256) { throw "Node SHA256 mismatch: expected $NodeSha256, got $actual" }
        Expand-Archive -Path $dest -DestinationPath "C:\nodejs" -Force
        Remove-Item $dest
        $NodeDir = "C:\nodejs\node-$NodeVer-win-x64"
        [Environment]::SetEnvironmentVariable('Path', [Environment]::GetEnvironmentVariable('Path', 'Machine') + ";$NodeDir", 'Machine')

    - name: Verify npm Supports Release-Age Cooldown
      # npm must be >= 11.10.0 because that has `min-release-age`. Anything lower will just silently ignore, not acceptable.
      run: |
        Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
        $ErrorActionPreference = "Stop"
        node --version
        $npm = (npm --version).Trim()
        Write-Host "npm $npm"
        $p = $npm.Split('.')
        if ([int]$p[0] -lt 11 -or ([int]$p[0] -eq 11 -and [int]$p[1] -lt 10)) {
            throw "npm $npm is too old for min-release-age (need >= 11.10.0)"
        }

    - name: Install clang-format
      # gets clang-format, nice
      run: |
        winget install --id=LLVM.LLVM -e --silent
        [Environment]::SetEnvironmentVariable('Path', [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';C:\Program Files\LLVM\bin', 'Machine')

    - name: Install cargo-deny
      run: cargo install --locked cargo-deny

    - name: Fetch Cargo Dependencies
      workdir: virtci
      run: cargo fetch --locked

    - name: Rust Security and License Audit
      workdir: virtci
      run: cargo deny check

    # - name: Install NPM Dependencies (locked, scripts blocked)
    #   workdir: virtci/web
    #   run: |
    #     Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
    #     npm ci

    # - name: NPM Provenance and Signature Audit
    #   workdir: virtci/web
    #   run: |
    #     Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
    #     npm audit signatures

    # - name: NPM Vulnerability Audit
    #   workdir: virtci/web
    #   run: |
    #     Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
    #     npm audit --audit-level=moderate

    # - name: Web Lint and Build
    #   workdir: virtci/web
    #   run: |
    #     Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
    #     npm run lint
    #     npm run build

    - name: Clippy
      workdir: virtci
      run: cargo clippy --locked -- -D warnings

    - name: Check Formatting
      workdir: virtci
      run: |
        cargo fmt --check
        Get-ChildItem -Recurse -Include *.c | ForEach-Object { clang-format --dry-run --Werror $_.FullName }
      continue_on_error: true
